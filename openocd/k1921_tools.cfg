# Вспомогательные процедуры; подключаются после target/k1921vg7t.cfg.
# Автор: Дмитрий (GitHub: mamkincoderr), Telegram: https://t.me/oDeXteRo
#
# В разъёме JTAG платы нет nRESET. Пуск после записи — k1921_run: отладочный модуль
# делает ndmreset и отпускает ядро с вектора 0. Линию DTR загрузчика (XP4) для этого не трогаем.
# Программный сброс RCU->RSTSYS (процедура НИИЭТ k1921vg7t_sw_reset) не используется: после
# нескольких таких сбросов подряд флеш-контроллер зависал, а процедура НИИЭТ к тому же
# заканчивается командой "adapter speed 1000" (кристалл допускает TCK не выше 200-250 кГц).

# Подготовка к записи Flash: ядро остановлено, прерывания приложения запрещены,
# тактирование переключено на HSI.
proc k1921_prepare {} {
    halt
    reg mstatus 0
    reg mie 0
    mww 0x50004020 0
    sleep 20
}

# После записи: сброс ядра через отладочный модуль и пуск.
# Загрузчик с адреса 0 сам передаёт управление приложению, если BOOT.EN# не удерживается.
proc k1921_run {} {
    reset run
}
